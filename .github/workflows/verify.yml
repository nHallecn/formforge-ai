name: Verify form repair
on:
  pull_request:
  push:
    branches: [main]
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contract
      - name: Generate deterministic test fixture (NOT an AI response)
        run: CI=true npm run repair -- --mock=known
      - run: npm run build
      - run: npm test
